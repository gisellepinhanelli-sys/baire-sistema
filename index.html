<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baire | Sistema de Gestão</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #1f2937);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    .logo {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      background: #111827;
      color: #ffffff;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
    }

    .logo h1 {
      color: #111827;
      font-size: 30px;
      letter-spacing: 1px;
    }

    .logo p {
      color: #6b7280;
      margin-top: 6px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: #374151;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      height: 50px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 0 15px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    .form-group input:focus {
      border-color: #111827;
      box-shadow: 0 0 0 3px rgba(17, 24, 39, 0.08);
    }

    .forgot {
      text-align: right;
      margin-top: -8px;
      margin-bottom: 25px;
    }

    .forgot a {
      color: #4b5563;
      font-size: 13px;
      text-decoration: none;
    }

    .forgot a:hover {
      text-decoration: underline;
    }

    .btn-login {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-login:hover {
      background: #374151;
      transform: translateY(-1px);
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      color: #9ca3af;
      font-size: 12px;
    }

    .error {
      display: none;
      color: #dc2626;
      background: #fef2f2;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      margin-bottom: 15px;
      text-align: center;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 30px 22px;
      }

      .logo h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="logo">
      <div class="logo-icon">B</div>
      <h1>BAIRE</h1>
      <p>Toners & Impressoras</p>
    </div>

    <div class="error" id="error">
      Informe seu usuário e senha.
    </div>

    <form onsubmit="entrar(event)">

      <div class="form-group">
        <label for="usuario">Usuário</label>
        <input
          type="text"
          id="usuario"
          placeholder="Digite seu usuário"
        >
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input
          type="password"
          id="senha"
          placeholder="Digite sua senha"
        >
      </div>

      <div class="forgot">
        <a href="#" onclick="alert('A recuperação de senha será configurada posteriormente.')">
          Esqueci minha senha
        </a>
      </div>

      <button type="submit" class="btn-login">
        Entrar
      </button>

    </form>

    <div class="footer">
      Sistema de Gestão Baire © 2026
    </div>

  </div>

  <script>
    function entrar(event) {
      event.preventDefault();

      const usuario = document.getElementById("usuario").value;
      const senha = document.getElementById("senha").value;
      const error = document.getElementById("error");

      if (usuario === "" || senha === "") {
        error.style.display = "block";
        return;
      }

      error.style.display = "none";

      alert("Login realizado com sucesso! A próxima etapa será o Dashboard da Baire.");
    }
  </script>

</body>
</html>
